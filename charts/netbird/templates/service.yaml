apiVersion: v1
kind: Service
metadata:
  name: {{ include (printf "%s.fullname" .Chart.Name) . }}
  labels:
    {{- include (printf "%s.labels" .Chart.Name) . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpcPort }}
      targetPort: netbird
      protocol: TCP
      name: netbird
    - port: {{ .Values.service.stunPort }}
      targetPort: netbird-stun
      protocol: UDP
      name: netbird-stun
  selector:
    {{- include (printf "%s.selectorLabels" .Chart.Name) . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-grpc" (include (printf "%s.fullname" .Chart.Name) .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include (printf "%s.labels" .Chart.Name) . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.grpcPort }}
      targetPort: netbird
      protocol: TCP
      name: netbird
  selector:
    {{- include (printf "%s.selectorLabels" .Chart.Name) . | nindent 4 }}